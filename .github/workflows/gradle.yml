# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "1.21.1-NeoForge" ]
  pull_request:
    branches: [ "1.21.1-NeoForge" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Get Dep
      run: git clone https://github.com/Maf1sher/Mantle-NeoForge && git clone https://github.com/Maf1sher/TinkersConstruct-NeoForge && git clone https://github.com/Maf1sher/tinkers-levelling-addon-NeoForge

    - name: Build Mantle
      run: cd Mantle-NeoForge && chmod +x ./gradlew && ./gradlew build

    - name: Build TC3
      run: cd TinkersConstruct-NeoForge && chmod +x ./gradlew && ./gradlew build

    - name: Build This
      run: cd tinkers-levelling-addon-NeoForge && chmod +x ./gradlew && ./gradlew build

    - name: Upload Mantle
      uses: actions/upload-artifact@v7.0.2
      with:
        name: Mantle
        path: Mantle-NeoForge/build/libs/*.jar

    - name: Upload TC3
      uses: actions/upload-artifact@v7.0.2
      with:
        name: TC3
        path: TinkersConstruct-NeoForge/build/libs/*.jar

    - name: Upload This
      uses: actions/upload-artifact@v7.0.2
      with:
        name: Mantle
        path: tinkers-levelling-addon-NeoForge/build/libs/*.jar

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
